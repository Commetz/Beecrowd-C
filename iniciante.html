<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categoria - EXEMPLO</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
    }
    h1 {
      color: #00ffc3;
      text-align: center;
      margin-bottom: 2rem;
    }
    ul {
      list-style: none;
      padding: 0;
      max-width: 600px;
      margin: auto;
    }
    li {
      background: #1c1c1c;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    li:hover {
      background: #2d2d2d;
    }
    pre {
      background: #101010;
      padding: 1rem;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-x: auto;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <h1>Categoria: EXEMPLO</h1>
  <ul id="fileList">
    <!-- Arquivos serão inseridos aqui -->
  </ul>
  <pre id="codeDisplay">Selecione um exercício para ver o código.</pre>

  <script>
    const arquivos = [
      '1234.c',
      '1240.c',
      '1241.c'
      // Adicione os arquivos aqui
    ];

    const pasta = 'Iniciante'; 

    const fileList = document.getElementById('fileList');
    const codeDisplay = document.getElementById('codeDisplay');

    arquivos.forEach(nome => {
      const li = document.createElement('li');
      li.textContent = nome;
      li.onclick = async () => {
        try {
          const response = await fetch(`./${nome}`);
          const code = await response.text();
          codeDisplay.textContent = code;
        } catch (e) {
          codeDisplay.textContent = 'Erro ao carregar o arquivo.';
        }
      };
      fileList.appendChild(li);
    });
  </script>
</body>
</html>
