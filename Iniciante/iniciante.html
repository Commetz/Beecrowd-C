<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciante - Exercícios</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
    }
    h1 {
      color: #00ffc3;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 1rem;
    }
    button {
      background-color: #1e1e1e;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #2a2a2a;
      transform: scale(1.05);
    }
    pre {
      background-color: #1e1e1e;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Iniciante - Exercícios</h1>
  <ul>
    <li><button onclick="mostrarCodigo('1041.c')">1041.c</button></li>
    <!-- Adicione mais arquivos aqui -->
  </ul>
  <pre id="codigo"></pre>

  <script>
    async function mostrarCodigo(arquivo) {
      const response = await fetch(`${arquivo}`);
      if (response.ok) {
        const codigo = await response.text();
        document.getElementById('codigo').textContent = codigo;
      } else {
        document.getElementById('codigo').textContent = 'Erro ao carregar o código.';
      }
    }
  </script>
</body>
</html>
