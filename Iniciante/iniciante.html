<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciante - Exercícios</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
    }
    h1 {
      color: #00ffc3;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 1rem;
    }
    button {
      background-color: #1e1e1e;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #2a2a2a;
      transform: scale(1.05);
    }
    pre {
      background-color: #1e1e1e;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Iniciante - Exercícios</h1>
  <ul id="lista-arquivos">
    <!-- Arquivos serão adicionados dinamicamente -->
  </ul>
  <pre id="codigo"></pre>

  <script>
    const arquivos = ['1000.c', '1001.c', '1002.c', '1003.c', '1004.c', '1005.c', '1006.c', '1007.c', '1008.c', '1009.c', '1010.c', '1011.c', '1012.c', '1013.c', '1014.c', '1015.c', '1016.c', '1017.c', '1018.c', '1019.c', '1020.c', '1021.c', '1035.c', '1036.c', '1037.c', '1038.c', '1040.c', '1041.c']; 

    const lista = document.getElementById('lista-arquivos');
    arquivos.forEach(arquivo => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.textContent = arquivo;
      btn.onclick = () => mostrarCodigo(arquivo);
      li.appendChild(btn);
      lista.appendChild(li);
    });

    async function mostrarCodigo(arquivo) {
      const response = await fetch(`Iniciante/${arquivo}`);
      if (response.ok) {
        const codigo = await response.text();
        document.getElementById('codigo').textContent = codigo;
      } else {
        document.getElementById('codigo').textContent = 'Erro ao carregar o código.';
      }
    }
  </script>
</body>
</html>
